server {
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Serve the NHL rink directly at the root — no redirect needed
    location = / {
        try_files /html/index.html =404;
    }

    # Serve files; also try appending .html for extensionless URLs
    # e.g. /html/ice-hockey → html/ice-hockey.html
    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }
}
